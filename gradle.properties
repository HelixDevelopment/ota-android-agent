# Helix OTA — ota-android-agent build properties.
# Point Gradle's toolchain auto-detection at locally-installed JDKs so the :core
# jvmToolchain(17) resolves without auto-provisioning (offline-friendly).
org.gradle.java.installations.paths=/opt/homebrew/Cellar/openjdk@17/17.0.19/libexec/openjdk.jdk/Contents/Home,/opt/homebrew/Cellar/openjdk@21/libexec/openjdk.jdk/Contents/Home

# Configuration-on-demand keeps `gradle :core:test` from configuring the :android
# project (whose AGP plugin is incompatible with Gradle 9.5 in this environment).
org.gradle.configureondemand=true

kotlin.code.style=official
